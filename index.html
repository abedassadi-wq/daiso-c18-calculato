<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="description" content="מחשבון העמסת פפטיד לקולונת DaisoGel C18"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="C18 Calc"><title>DaisoGel C18 Calculator</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Arial,sans-serif;background:#f5f6f8;margin:0;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));color:#181818}.card{max-width:540px;margin:0 auto;background:#fff;padding:22px;border-radius:18px;box-shadow:0 3px 20px #0001}h2{font-size:21px;margin:0 0 6px}.sub{font-size:13px;color:#666;margin-bottom:22px}.grid,.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:13px;color:#555;margin-bottom:7px}select,input[type=number]{width:100%;padding:12px 8px;border:1px solid #bbb;border-radius:9px;background:white;color:#111;font-size:18px;direction:ltr;text-align:left}input[type=range]{width:100%;direction:ltr;accent-color:#111;touch-action:pan-y;cursor:pointer;margin:16px 0 8px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px}.value{font-size:24px;font-weight:750}.ticks{display:flex;justify-content:space-between;direction:ltr;color:#777;font-size:12px}.results{border-top:1px solid #ddd;padding-top:20px;margin-top:23px}.num{font-size:24px;font-weight:750;direction:ltr;text-align:left;white-space:nowrap}.unit{direction:ltr;text-align:left;color:#666;font-size:13px}.note,.warn{font-size:12px;line-height:1.6;margin-top:17px;color:#666}.warn{color:#805000}button{border:1px solid #ddd;border-radius:9px;padding:11px 16px;background:white;color:#111;font-size:15px;margin-top:18px}#status{font-size:12px;color:#666;margin-top:14px}@media(max-width:390px){.card{padding:16px}.num{font-size:20px}}</style></head><body><main class="card"><h2>מחשבון העמסת פפטיד – DaisoGel C18</h2><div class="sub" dir="ltr">SP-120-15-ODS-RPS · 15 µm · 120 Å</div><div class="grid"><div><label for="diam">קוטר קולונה (מ״מ)</label><select id="diam"><option>40</option><option>80</option><option>100</option><option>200</option><option>300</option><option>400</option><option selected>600</option><option>800</option><option>1000</option></select></div><div><label for="height">גובה אריזה (ס״מ)</label><input id="height" type="number" inputmode="decimal" min="1" max="200" value="25"></div></div><div class="line"><strong dir="ltr">Loading (g Crude/L CV)</strong><output class="value" id="loadingValue" dir="ltr">20</output></div><input id="loading" type="range" min="1" max="100" step="1" value="20" dir="ltr" style="direction:ltr"><div class="ticks"><span>1</span><span>25</span><span>50</span><span>75</span><span>100</span></div><div class="results"><div><label>נפח קולונה (1 CV)</label><div class="num" id="cv">70.69 L</div></div><div><label>כמות Crude להזרקה</label><div class="num" id="mass">1,413.7 g</div><div class="unit" id="kg">1.414 kg</div></div></div><div id="warning" class="warn" hidden>העמסה גבוהה: נדרש Loading Study לאימות הפרדה, טוהר והתאוששות.</div><button id="reset" type="button">איפוס ערכים</button><div id="status" aria-live="polite">מוכן לחישוב</div><div class="note">העמסה מחושבת אינה מבטיחה קיבולת הפרדה בפועל.</div></main><script>(function(){'use strict';var d=document.getElementById('diam'),h=document.getElementById('height'),l=document.getElementById('loading'),v=document.getElementById('loadingValue'),cvEl=document.getElementById('cv'),mEl=document.getElementById('mass'),kgEl=document.getElementById('kg'),warn=document.getElementById('warning');function fmt(n,k){return n.toLocaleString('en-US',{minimumFractionDigits:k,maximumFractionDigits:k})}function update(){var diameter=Number(d.value),height=Number(h.value),loading=Number(l.value),cv=Math.PI*Math.pow(diameter/20,2)*height/1000,mass=cv*loading;v.textContent=loading;cvEl.textContent=fmt(cv,2)+' L';mEl.textContent=fmt(mass,1)+' g';kgEl.textContent=fmt(mass/1000,3)+' kg';warn.hidden=loading<=40;l.style.background='transparent';document.getElementById('status').textContent='התוצאות מעודכנות';try{localStorage.setItem('daiso-c18-v2',JSON.stringify({d:d.value,h:h.value,l:l.value}))}catch(e){}}try{var saved=JSON.parse(localStorage.getItem('daiso-c18-v2'));if(saved){if(Array.from(d.options).some(function(o){return o.value===saved.d}))d.value=saved.d;if(Number(saved.h)>0)h.value=saved.h;if(Number(saved.l)>=1&&Number(saved.l)<=100)l.value=saved.l}}catch(e){}[d,h,l].forEach(function(el){el.addEventListener('input',update);el.addEventListener('change',update)});document.getElementById('reset').addEventListener('click',function(){d.value='600';h.value='25';l.value='20';update()});update()})();if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script></body></html>
